<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Impact Challenge</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --line:#334155;
    --text:#e2e8f0; --muted:#94a3b8; --blue:#60a5fa; --blue2:#93c5fd;
    --orange:#f59e0b; --orange2:#b45309; --green:#34d399; --red:#f87171;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  .app{max-width:980px;margin:0 auto;padding:12px 14px 24px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  header h1{font-size:15px;margin:0;font-weight:700;flex:1}
  .hud{display:flex;gap:8px;font-size:12px;color:var(--muted)}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
  .pill b{color:var(--text)}
  .iconBtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    color:var(--text);font-weight:700;cursor:pointer}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px}
  .stage{overflow:hidden;line-height:0}
  canvas{display:block;width:100%}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  @media (max-width:680px){.row{grid-template-columns:1fr}}
  .given,.control{padding:14px 16px}
  .cardTitle{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:700;margin-bottom:8px}
  .glist{display:grid;grid-template-columns:auto auto;gap:4px 14px;font-size:13.5px;justify-content:start}
  .glist span:nth-child(odd){color:var(--muted)}
  .glist span:nth-child(even){font-weight:700;font-variant-numeric:tabular-nums}
  .question{margin-top:10px;font-size:14px;line-height:1.4}
  .hintBox{margin-top:10px;font-size:13px;line-height:1.4;background:rgba(245,158,11,.1);
    border:1px solid rgba(245,158,11,.35);border-radius:10px;padding:8px 10px;color:#fcd34d}
  .ctlHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .ctlHead label{font-weight:700;font-size:14px}
  .valWrap{display:flex;align-items:center;gap:4px;color:var(--orange);font-weight:800}
  .valWrap input{width:84px;background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--orange);
    font:inherit;font-size:16px;text-align:right;padding:4px 8px;font-variant-numeric:tabular-nums}
  .valWrap input::-webkit-outer-spin-button,.valWrap input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .valWrap input{-moz-appearance:textfield;appearance:textfield}
  .valWrap input:focus{outline:2px solid var(--orange);outline-offset:1px}
  .slider{position:relative;height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--line);
    touch-action:none;cursor:pointer;user-select:none}
  .slider .fill{position:absolute;left:0;top:0;bottom:0;border-radius:11px 0 0 11px;
    background:linear-gradient(90deg,var(--orange2),var(--orange))}
  .slider .knob{position:absolute;top:50%;width:28px;height:28px;border-radius:50%;background:#fff;
    transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .slider.disabled{opacity:.5;cursor:default}
  .ctlBtns{display:flex;gap:8px;margin-top:12px}
  button{font:inherit}
  .btn{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;
    padding:10px 14px;font-weight:700;cursor:pointer;font-size:14px}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.step{width:44px;padding:10px 0;font-size:18px;line-height:1}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#0f172a;flex:1}
  .btn.hintB{color:#fcd34d}
  .small{font-size:11.5px;color:var(--muted);margin-top:8px;text-align:center}
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.55);display:none;align-items:center;justify-content:center;
    padding:16px;z-index:10}
  .overlay.show{display:flex}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:480px;width:100%;
    padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:90vh;overflow:auto}
  .modal h2{margin:0 0 8px;font-size:20px}
  .modal .kicker{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:700;margin-bottom:4px}
  .modal p,.modal li{font-size:14px;line-height:1.5;color:#cbd5e1}
  .modal ol,.modal ul{padding-left:20px;margin:6px 0}
  .modal .btn.primary{width:100%;margin-top:14px;padding:12px}
  .modal input.name{width:100%;margin-top:8px;background:var(--card2);border:1px solid var(--line);border-radius:10px;
    color:var(--text);padding:10px 12px;font:inherit}
  .muted{color:var(--muted)}
  .big{font-size:34px;font-weight:800;margin:4px 0}
  .good{color:var(--green)} .ok{color:var(--orange)} .bad{color:var(--red)}
  .cmp{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
  .cmp div{background:var(--card2);border-radius:10px;padding:8px;text-align:center}
  .cmp small{display:block;color:var(--muted);font-size:11px}
  .cmp b{font-size:16px;font-variant-numeric:tabular-nums}
  details{background:var(--card2);border-radius:10px;padding:8px 12px;margin-top:8px}
  summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--blue2)}
  .math{font-size:13.5px;line-height:1.7;color:#cbd5e1;margin-top:6px}
  .math .trap{color:#fca5a5}
  table.sum{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  table.sum td{padding:6px 4px;border-bottom:1px solid var(--line)}
  table.sum td:last-child{text-align:right;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Impact Challenge</h1>
    <div class="hud">
      <span class="pill" id="hudRound">Round <b>–</b></span>
      <span class="pill">Score <b id="hudScore">0</b></span>
    </div>
    <button class="iconBtn" id="helpBtn" aria-label="Help">?</button>
  </header>

  <div class="card stage"><canvas id="cv"></canvas></div>

  <div class="row">
    <div class="card given">
      <div class="cardTitle" id="givenTitle">Given</div>
      <div class="glist" id="given"></div>
      <div class="question" id="question"></div>
      <div id="hintArea"></div>
    </div>
    <div class="card control">
      <div class="ctlHead">
        <label for="valInput" id="ctlLabel">Your answer</label>
        <span class="valWrap"><input id="valInput" type="number" inputmode="decimal"><span id="unit"></span></span>
      </div>
      <div class="slider" id="slider"><div class="fill"></div><div class="knob"></div></div>
      <div class="ctlBtns">
        <button class="btn step" id="minus" aria-label="Decrease">−</button>
        <button class="btn step" id="plus" aria-label="Increase">+</button>
        <button class="btn hintB" id="hintBtn">Hint −30</button>
        <button class="btn primary" id="goBtn">Launch</button>
      </div>
      <div class="small">Drag the slider, tap ± or type your number · laptop: ← → keys (Shift = fine), Enter = launch</div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const G = 9.81, ATTEMPTS = 3, HINT_COST = 30;
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 600, H = 320;

/* ---------- helpers ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
const rr = (a, b, d) => +rnd(a, b).toFixed(d);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const f = (x, d = 2) => (+x).toFixed(d);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const DEG = Math.PI / 180;
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function label(t, x, y, color = '#94a3b8', align = 'left', size = 12, weight = 600) {
  ctx.fillStyle = color; ctx.textAlign = align; ctx.font = `${weight} ${size}px system-ui,sans-serif`; ctx.fillText(t, x, y);
}
function arrow(x1, y1, x2, y2, color, w = 3) {
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w; line(x1, y1, x2, y2);
  const a = Math.atan2(y2 - y1, x2 - x1), s = 9;
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - s * Math.cos(a - 0.45), y2 - s * Math.sin(a - 0.45));
  ctx.lineTo(x2 - s * Math.cos(a + 0.45), y2 - s * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();
}
function scoreFrom(err, tol, zero) { return err <= tol ? 100 : Math.round(100 * Math.max(0, 1 - (err - tol) / zero)); }

/* ---------- state ---------- */
const S = { round: 0, attempt: 0, scores: [[], [], []], phase: 'idle', p: null, value: 0,
  hint: false, anim: null, name: '', t: 0 };

/* =========================================================
   ROUND 1 — Drop & Bounce
   ========================================================= */
const drop = {
  title: 'Drop & Bounce', tag: 'Coefficient of restitution · direct impact',
  intro: 'A ball is dropped from rest onto a rigid floor. <b>Predict how high it bounces back.</b> Move the orange line to your prediction, then hit <b>Drop</b>.',
  go: 'Drop',
  gen(a) {
    const h = rr(1.2, 2.0, 2), e = rr(0.4, 0.9, 2), n = a === 2 ? 2 : 1;
    return { h, e, n, ans: +(h * Math.pow(e, 2 * n)).toFixed(4) };
  },
  given: p => [['Drop height h', f(p.h) + ' m'], ['Coefficient of restitution e', f(p.e)], ['Floor', 'rigid, fixed']],
  question: p => `How high does the ball rise after the <b>${p.n === 1 ? 'first' : 'second'}</b> bounce?`,
  hint: 'e relates <b>speeds</b>, not heights: e = v′/v. Use v = √(2gh) to go from height to speed and back.',
  slider: p => ({ min: 0, max: p.h, step: 0.01, dec: 2, unit: 'm', label: 'Predicted height', init: +(p.h / 2).toFixed(2) }),
  start(p) { S.anim = { y: p.h, vy: 0, b: 0, done: false, trail: [] }; },
  step(p, an, dt) {
    dt *= 0.85;
    const N = 20;
    for (let i = 0; i < N && !an.done; i++) {
      const h = dt / N;
      an.vy -= G * h; an.y += an.vy * h;
      if (an.y <= 0 && an.vy < 0) { an.y = 0; an.vy = -p.e * an.vy; an.b++; }
      if (an.b === p.n && an.vy <= 0 && an.y > 0) { an.y = p.ans; an.done = true; }
    }
    an.trail.push(an.y); if (an.trail.length > 60) an.trail.shift();
    return an.done;
  },
  draw(p, v, an) {
    const top = 22, bottom = H - 26, left = 62, maxH = 2.2, sy = (bottom - top) / maxH;
    const Y = y => bottom - y * sy, r = 11, bx = W * 0.56;
    ctx.fillStyle = '#334155'; ctx.fillRect(0, bottom, W, H - bottom);
    ctx.fillStyle = '#475569'; ctx.fillRect(0, bottom, W, 3);
    ctx.strokeStyle = '#475569'; ctx.lineWidth = 1;
    line(left, Y(0), left, Y(maxH));
    for (let i = 0; i <= 22; i++) {
      const y = Y(i / 10), major = i % 5 === 0;
      line(left - (major ? 10 : 5), y, left, y);
      if (major) label((i / 10).toFixed(1) + ' m', left - 14, y + 4, '#94a3b8', 'right', 11);
    }
    // drop height
    ctx.setLineDash([4, 5]); ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1.5; line(left, Y(p.h), W - 16, Y(p.h)); ctx.setLineDash([]);
    label('h = ' + f(p.h) + ' m', W - 18, Y(p.h) - 6, '#94a3b8', 'right');
    // prediction
    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2.5; line(left, Y(v), W - 16, Y(v));
    label('your guess ' + f(v) + ' m', W - 18, Y(v) + 16, '#f59e0b', 'right', 12, 700);
    // actual
    if (an && an.done) {
      ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2.5; line(left, Y(p.ans), W - 16, Y(p.ans));
      label('actual ' + f(p.ans, 3) + ' m', left + 8, Y(p.ans) - 6, '#34d399', 'left', 12, 700);
    }
    // trail
    if (an) an.trail.forEach((y, i) => circle(bx, Y(y) - r, r * 0.35, `rgba(147,197,253,${i / an.trail.length * 0.35})`));
    const by = an ? an.y : p.h;
    circle(bx, Y(by) - r, r, '#93c5fd'); circle(bx - 3, Y(by) - r - 3, 3.5, 'rgba(255,255,255,.7)');
  },
  result(p, v) {
    const err = Math.abs(v - p.ans), v1 = Math.sqrt(2 * G * p.h), v1p = p.e * v1, h1 = p.h * p.e * p.e;
    let m = `v (just before impact) = √(2gh) = √(2·9.81·${f(p.h)}) = <b>${f(v1)} m/s</b><br>
      v′ (just after) = e·v = ${f(p.e)}·${f(v1)} = <b>${f(v1p)} m/s</b><br>
      h₁ = v′²/(2g) = e²·h = <b>${f(h1, 3)} m</b>`;
    if (p.n === 2) m += `<br>Second bounce: h₂ = e²·h₁ = e⁴·h = <b>${f(p.ans, 3)} m</b>`;
    const trap = p.n === 1 ? p.e * p.h : p.e * p.e * p.h;
    m += `<br><span class="trap">Common trap: using ${p.n === 1 ? 'e·h' : 'e²·h'} = ${f(trap, 3)} m. e scales the speed, so the height scales with e².</span>`;
    return { score: scoreFrom(err, 0.02, 0.30), yours: f(v) + ' m', correct: f(p.ans, 3) + ' m', math: m };
  }
};

/* =========================================================
   ROUND 2 — Bank Shot (oblique impact)
   ========================================================= */
const TW = 2.0, TH = 1.0;
const bank = {
  title: 'Bank Shot', tag: 'Oblique impact · Examples 4 & 6',
  intro: 'Bank the ball <b>once off the top cushion</b> into the highlighted pocket. The cushion isn\'t perfectly elastic, so the ball does <b>not</b> leave at the same angle it came in. Set your aim angle θ, then <b>Shoot</b>.',
  go: 'Shoot',
  gen() {
    for (let k = 0; k < 500; k++) {
      const e = rr(0.5, 0.9, 2), d = rr(0.25, 0.6, 2), P = Math.random() < 0.5 ? 1.0 : 2.0, th = rnd(25, 62) * DEG;
      const D = +((d + TH / e) / Math.tan(th)).toFixed(2), x0 = +(P - D).toFixed(2);
      if (x0 < 0.12 || x0 > P - 0.15) continue;
      const ans = Math.atan((d + TH / e) / D) / DEG;
      return { e, d, P, D, x0, ans: +ans.toFixed(2) };
    }
    return { e: 0.6, d: 0.4, P: 2.0, D: 1.5, x0: 0.5, ans: +(Math.atan((0.4 + 1 / 0.6) / 1.5) / DEG).toFixed(2) };
  },
  given: p => [['Coefficient of restitution e', f(p.e)], ['Ball → top cushion, d', f(p.d) + ' m'],
    ['Table width (cushion → far rail)', f(TH) + ' m'], ['Ball → pocket (horizontal), D', f(p.D) + ' m']],
  question: () => 'At what angle θ (measured from the top cushion) should you shoot? Smooth table, neglect ball size.',
  hint: 'At the cushion, the velocity component <b>along</b> the cushion is unchanged; only the <b>normal</b> component is multiplied by e. So tan θ′ = e·tan θ.',
  slider: () => ({ min: 10, max: 80, step: 0.1, dec: 1, unit: '°', label: 'Aim angle θ', init: 45 }),
  geom() {
    const m = 34, s = Math.min((W - 2 * m) / TW, (H - 2 * m) / TH);
    return { s, ox: (W - TW * s) / 2, oy: (H - TH * s) / 2 };
  },
  landX(p, deg) { return p.x0 + (p.d + TH / p.e) / Math.tan(deg * DEG); },
  start(p, v) {
    const sp = 2.4;
    S.anim = { x: p.x0, y: p.d, vx: sp * Math.cos(v * DEG), vy: -sp * Math.sin(v * DEG), bounced: false, done: false, trail: [], sink: 0 };
  },
  step(p, an, dt) {
    if (an.done) return true;
    const N = 10;
    for (let i = 0; i < N; i++) {
      const h = dt / N;
      an.x += an.vx * h; an.y += an.vy * h;
      if (!an.bounced && an.y <= 0) { an.y = 0; an.vy = -p.e * an.vy; an.bounced = true; }
      if (an.y >= TH || an.x >= TW || an.x <= 0) {
        an.x = clamp(an.x, 0, TW); an.y = clamp(an.y, 0, TH); an.done = true; break;
      }
    }
    an.trail.push([an.x, an.y]); if (an.trail.length > 400) an.trail.shift();
    return an.done;
  },
  draw(p, v, an) {
    const { s, ox, oy } = this.geom(), X = x => ox + x * s, Y = y => oy + y * s, rail = Math.max(10, s * 0.06);
    ctx.fillStyle = '#5b3a1e'; roundRect(ox - rail, oy - rail, TW * s + 2 * rail, TH * s + 2 * rail, 12); ctx.fill();
    ctx.fillStyle = '#0e7490'; ctx.fillRect(ox, oy, TW * s, TH * s);
    ctx.fillStyle = 'rgba(255,255,255,.04)'; for (let i = 1; i < 8; i++) ctx.fillRect(X(i * TW / 8), oy, 1, TH * s);
    const pr = 0.05 * s;
    [[0, 0], [1, 0], [2, 0], [0, 1], [1, 1], [2, 1]].forEach(([x, y]) => circle(X(x), Y(y), pr, '#020617'));
    // target pocket
    const pulse = 0.5 + 0.5 * Math.sin(S.t * 5);
    ctx.strokeStyle = `rgba(245,158,11,${0.5 + 0.5 * pulse})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(X(p.P), Y(TH), pr + 5 + pulse * 3, 0, Math.PI * 2); ctx.stroke();
    label('TARGET', X(p.P) + (p.P === 2 ? -10 : 0), Y(TH) + rail + 14 > H - 2 ? Y(TH) - pr - 10 : Y(TH) + rail + 14, '#f59e0b', p.P === 2 ? 'right' : 'center', 11, 800);
    label('top cushion', X(TW / 2) + pr + 30, oy - rail / 2 + 4, '#fcd9b6', 'left', 10, 700);
    // dimensions
    ctx.setLineDash([3, 4]); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
    line(X(p.x0), Y(p.d), X(p.x0), Y(0));
    line(X(p.x0), Y(p.d), X(p.x0), Y(TH) - 14);
    line(X(p.x0), Y(TH) - 14, X(p.P), Y(TH) - 14);
    ctx.setLineDash([]);
    label('d = ' + f(p.d) + ' m', X(p.x0) - 6, Y(p.d / 2) + 4, '#e2e8f0', 'right', 11);
    label('D = ' + f(p.D) + ' m', (X(p.x0) + X(p.P)) / 2, Y(TH) - 20, '#e2e8f0', 'center', 11);
    // trail
    if (an) {
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(X(p.x0), Y(p.d)); an.trail.forEach(([x, y]) => ctx.lineTo(X(x), Y(y))); ctx.stroke();
    }
    // aim
    const bx = an ? an.x : p.x0, by = an ? an.y : p.d;
    if (!an) {
      const L = 0.45;
      ctx.setLineDash([6, 5]);
      arrow(X(p.x0), Y(p.d), X(p.x0 + L * Math.cos(v * DEG)), Y(p.d - L * Math.sin(v * DEG)), '#f59e0b', 2.5);
      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(245,158,11,.4)'; ctx.lineWidth = 1; line(X(p.x0), Y(p.d), X(p.x0 + 0.25), Y(p.d));
      ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(X(p.x0), Y(p.d), 0.14 * s, -v * DEG, 0); ctx.stroke();
      label('θ = ' + f(v, 1) + '°', X(p.x0 + 0.17), Y(p.d) - 5, '#f59e0b', 'left', 12, 800);
    }
    const br = Math.max(5, 0.025 * s) * (an && an.inPocket ? Math.max(0.2, 1 - an.sink) : 1);
    circle(X(bx), Y(by), br, '#f8fafc');
  },
  result(p, v) {
    const xl = this.landX(p, v), err = Math.abs(xl - p.P), tAns = Math.tan(p.ans * DEG);
    const thOut = Math.atan(p.e * tAns) / DEG;
    const mirror = Math.atan((p.d + TH) / p.D) / DEG, missM = Math.abs(this.landX(p, mirror) - p.P);
    const m = `Along the cushion: v<sub>t</sub>′ = v<sub>t</sub> (no friction)<br>
      Normal to cushion: v<sub>n</sub>′ = e·v<sub>n</sub> → tan θ′ = e·tan θ<br>
      Horizontal travel: D = d/tan θ + ${f(TH)}/(e·tan θ)<br>
      tan θ = (d + ${f(TH)}/e)/D = (${f(p.d)} + ${f(TH / p.e, 3)})/${f(p.D)} → <b>θ = ${f(p.ans, 1)}°</b><br>
      Ball leaves the cushion at θ′ = ${f(thOut, 1)}° (shallower!)<br>
      <span class="trap">Mirror trap (assume e = 1): θ = ${f(mirror, 1)}°, which misses by ${f(missM)} m.</span>`;
    return { score: scoreFrom(err, 0.05, 0.40), yours: f(v, 1) + '°', correct: f(p.ans, 1) + '°',
      extra: `Your shot landed ${f(Math.abs(xl - p.P))} m ${xl > p.P ? 'past' : 'short of'} the pocket.`, math: m, err };
  }
};

/* =========================================================
   ROUND 3 — Spring Shot (impact + energy)
   ========================================================= */
const XW = 3.0, L0 = 0.55;
const spring = {
  title: 'Spring Shot', tag: 'Impact + energy · Examples 2 & 5',
  intro: 'Block <b>A</b> slides into block <b>B</b>, which rests against an unstretched spring. Choose A\'s launch speed so the spring is compressed <b>exactly to the red line</b>. Work backwards! Then hit <b>Launch</b>.',
  go: 'Launch',
  gen() {
    for (let k = 0; k < 1000; k++) {
      const mB = rint(4, 10), e = rr(0.5, 0.9, 2), mAmax = e * mB;
      const mA = Math.round(rnd(1, mAmax) * 2) / 2; if (mA < 1 || mA > mAmax) continue;
      const kk = rint(2, 8) * 100, xs = rr(0.10, 0.30, 2);
      const vB = xs * Math.sqrt(kk / mB), vA = vB * (mA + mB) / (mA * (1 + e));
      if (vA < 1.5 || vA > 13.5) continue;
      return { mA, mB, e, k: kk, xs, vB, ans: +vA.toFixed(3) };
    }
  },
  given: p => [['Mass of A, m_A', f(p.mA, 1) + ' kg'], ['Mass of B, m_B', p.mB + ' kg'], ['Coefficient of restitution e', f(p.e)],
    ['Spring stiffness k', p.k + ' N/m'], ['Target compression x*', f(p.xs) + ' m'], ['Surface', 'smooth']],
  question: () => 'What launch speed v<sub>A</sub> makes the spring compress exactly x*?',
  hint: 'Work backwards. <b>Energy</b> (B + spring): ½m<sub>B</sub>v<sub>B</sub>² = ½kx² gives B\'s speed right after impact. Then <b>momentum + e</b> for the impact give v<sub>A</sub>.',
  slider: () => ({ min: 0, max: 15, step: 0.01, dec: 2, unit: 'm/s', label: 'Launch speed v_A', init: 5 }),
  dims(p) { return { wA: 0.18 + 0.025 * p.mA, wB: 0.2 + 0.025 * p.mB }; },
  geom() {
    const s = (W - 30) / 3.15, ground = H * 0.68;
    return { s, ox: 14, ground };
  },
  phys(p, v) {
    const vB = p.mA * v * (1 + p.e) / (p.mA + p.mB), vAp = v * (p.mA - p.e * p.mB) / (p.mA + p.mB);
    const w = Math.sqrt(p.k / p.mB);
    return { vB, vAp, w, x: vB / w };
  },
  start(p, v) {
    const ph = this.phys(p, v);
    S.anim = { u: 0, stage: v <= 0.001 ? 2 : 1, done: v <= 0.001, ph, xA: 0, xB: 0, tau: 0 };
  },
  step(p, an, dt) {
    if (an.done) return true;
    const { wA, wB } = this.dims(p), Bleft0 = XW - L0 - wB, Aright0 = 0.95, gap = Bleft0 - Aright0;
    if (an.stage === 1) {
      an.u = Math.min(1, an.u + dt / 0.9);
      an.xA = an.u * gap;
      if (an.u >= 1) { an.stage = 2; an.u = 0; }
    } else {
      an.u = Math.min(1, an.u + dt / 1.1);
      an.tau = an.u * (Math.PI / 2) / an.ph.w;
      an.xB = an.ph.vB / an.ph.w * Math.sin(an.ph.w * an.tau);
      an.xA = gap + an.ph.vAp * an.tau;
      if (an.u >= 1) { an.done = true; an.xB = an.ph.x; }
    }
    return an.done;
  },
  draw(p, v, an) {
    const { s, ox, ground } = this.geom(), X = x => ox + x * s, { wA, wB } = this.dims(p);
    ctx.fillStyle = '#334155'; ctx.fillRect(0, ground, W, H - ground);
    ctx.fillStyle = '#475569'; ctx.fillRect(0, ground, W, 3);
    // wall
    ctx.fillStyle = '#64748b'; ctx.fillRect(X(XW), ground - 0.55 * s, 0.1 * s, 0.55 * s);
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1;
    for (let i = 0; i < 7; i++) line(X(XW) + 0.1 * s, ground - i * 0.08 * s, X(XW) + 0.1 * s + 8, ground - i * 0.08 * s - 8);
    const xB = an ? an.xB : 0, xA = an ? an.xA : 0;
    const Bright = XW - L0 + xB, Bleft = Bright - wB, Aright = 0.95 + xA, Aleft = Aright - wA;
    // target line
    const tx = X(XW - L0 + p.xs);
    ctx.strokeStyle = '#f87171'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]); line(tx, ground - 0.5 * s, tx, ground + 10); ctx.setLineDash([]);
    label('x* = ' + f(p.xs) + ' m', tx, ground + 24, '#f87171', 'center', 11, 700);
    ctx.strokeStyle = 'rgba(148,163,184,.5)'; ctx.lineWidth = 1; line(X(XW - L0), ground + 4, X(XW - L0), ground + 12);
    // spring
    const sy = ground - wB * s * 0.5, amp = Math.min(0.06 * s, 10), n = 12, x1 = X(Bright), x2 = X(XW);
    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x1, sy);
    for (let i = 1; i < n; i++) ctx.lineTo(x1 + (x2 - x1) * i / n, sy + (i % 2 ? -amp : amp));
    ctx.lineTo(x2, sy); ctx.stroke();
    label('k = ' + p.k + ' N/m', (x1 + x2) / 2, sy - amp - 8, '#94a3b8', 'center', 11);
    // blocks
    const block = (l, w, c, t) => {
      ctx.fillStyle = c; roundRect(X(l), ground - w * s, w * s, w * s, 5); ctx.fill();
      label(t, X(l + w / 2), ground - w * s / 2 + 5, '#0f172a', 'center', Math.max(11, w * s * 0.3), 800);
    };
    block(Bleft, wB, '#93c5fd', 'B');
    block(Aleft, wA, '#f59e0b', 'A');
    label(f(p.mA, 1) + ' kg', X(Aleft + wA / 2), ground - wA * s - 6, '#fcd34d', 'center', 11);
    label(p.mB + ' kg', X(Bleft + wB / 2), ground - wB * s - 6, '#bfdbfe', 'center', 11);
    if (!an) {
      const len = clamp(v / 15, 0, 1) * 0.9 * s;
      if (len > 4) arrow(X(Aright) + 4, ground - wA * s / 2, X(Aright) + 4 + len, ground - wA * s / 2, '#f59e0b', 3);
      label('v_A = ' + f(v) + ' m/s', X(Aleft), ground - wA * s - 24, '#f59e0b', 'left', 12, 800);
    }
    if (an && an.done) {
      const ax = X(XW - L0 + an.ph.x);
      ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2.5; line(ax, ground - 0.62 * s, ax, ground + 4);
      label('actual ' + f(an.ph.x, 3) + ' m', ax, ground - 0.62 * s - 6, '#34d399', 'center', 12, 800);
      label(`after impact: v_A′ = ${f(an.ph.vAp)} m/s, v_B = ${f(an.ph.vB)} m/s`, 12, 20, '#cbd5e1', 'left', 12, 600);
    }
  },
  result(p, v) {
    const ph = this.phys(p, v), err = Math.abs(ph.x - p.xs);
    const vB = p.xs * Math.sqrt(p.k / p.mB), vAp = p.ans * (p.mA - p.e * p.mB) / (p.mA + p.mB);
    const m = `<b>1 · Energy</b> (B + spring, after impact):<br>½m<sub>B</sub>v<sub>B</sub>² = ½k x*² → v<sub>B</sub> = x*√(k/m<sub>B</sub>) = <b>${f(vB, 3)} m/s</b><br>
      <b>2 · Impact</b> (A + B system):<br>Momentum: m<sub>A</sub>v<sub>A</sub> = m<sub>A</sub>v<sub>A</sub>′ + m<sub>B</sub>v<sub>B</sub><br>
      Restitution: v<sub>B</sub> − v<sub>A</sub>′ = e·v<sub>A</sub><br>
      → v<sub>B</sub> = m<sub>A</sub>(1+e)v<sub>A</sub>/(m<sub>A</sub>+m<sub>B</sub>) → <b>v<sub>A</sub> = ${f(p.ans)} m/s</b><br>
      A after impact: v<sub>A</sub>′ = ${f(vAp)} m/s (${Math.abs(vAp) < 0.005 ? 'stops' : 'bounces back'})<br>
      <span class="trap">Energy is NOT conserved during the impact (e &lt; 1). Only momentum is.</span>`;
    return { score: scoreFrom(err, 0.01, 0.10), yours: f(v) + ' m/s', correct: f(p.ans) + ' m/s',
      extra: `Spring compressed ${f(ph.x, 3)} m (target ${f(p.xs)} m).`, math: m };
  }
};

const ROUNDS = [drop, bank, spring];
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

/* ---------- canvas & loop ---------- */
function resize() {
  const r = cv.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  W = r.width; H = clamp(W * 0.5, 250, 400);
  cv.style.height = H + 'px'; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  try { frame(now); } catch (err) { console.error(err); }
}
function frame(now) {
  const dt = Math.min(0.04, (now - last) / 1000); last = now; S.t += dt;
  const R = ROUNDS[S.round];
  if (S.phase === 'anim' && S.anim) {
    if (R.step(S.p, S.anim, dt) && !S.anim.finished) { S.anim.finished = true; setTimeout(showResult, 900); }
    if (R === bank && S.anim.done && S.anim.inPocket) S.anim.sink = Math.min(1, S.anim.sink + dt * 2);
  }
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#16213a'; ctx.fillRect(0, 0, W, H);
  if (S.p) R.draw(S.p, S.value, S.phase === 'input' ? null : S.anim);
}

/* ---------- control ---------- */
const slider = $('slider'), fill = slider.querySelector('.fill'), knob = slider.querySelector('.knob'), inp = $('valInput');
let cfg = { min: 0, max: 1, step: 0.01, dec: 2 };
function setValue(v, fromInput) {
  if (!isFinite(v)) return;
  v = clamp(v, cfg.min, cfg.max); v = Math.round(v / cfg.step) * cfg.step; v = +v.toFixed(cfg.dec);
  S.value = v; const fr = (v - cfg.min) / (cfg.max - cfg.min);
  fill.style.width = fr * 100 + '%'; knob.style.left = fr * 100 + '%';
  if (!fromInput) inp.value = v.toFixed(cfg.dec);
}
let dragging = false;
function fromPointer(e) { const r = slider.getBoundingClientRect(); setValue(cfg.min + clamp((e.clientX - r.left) / r.width, 0, 1) * (cfg.max - cfg.min)); }
slider.addEventListener('pointerdown', e => { if (S.phase !== 'input') return; dragging = true; slider.setPointerCapture(e.pointerId); fromPointer(e); });
slider.addEventListener('pointermove', e => { if (dragging) fromPointer(e); });
slider.addEventListener('pointerup', () => dragging = false);
slider.addEventListener('pointercancel', () => dragging = false);
inp.addEventListener('input', () => { if (S.phase === 'input') setValue(parseFloat(inp.value), true); });
inp.addEventListener('blur', () => setValue(S.value));
function holdRepeat(btn, dir) {
  let t1, t2;
  const stop = () => { clearTimeout(t1); clearInterval(t2); };
  btn.addEventListener('pointerdown', e => {
    if (S.phase !== 'input') return; e.preventDefault();
    setValue(S.value + dir * cfg.step); let n = 0;
    t1 = setTimeout(() => { t2 = setInterval(() => { n++; setValue(S.value + dir * cfg.step * (n > 25 ? 10 : 1)); }, 50); }, 350);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
}
holdRepeat($('minus'), -1); holdRepeat($('plus'), 1);
document.addEventListener('keydown', e => {
  if ($('overlay').classList.contains('show')) {
    if (e.key === 'Enter') { const b = document.querySelector('#modal .btn.primary'); if (b && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); b.click(); } }
    return;
  }
  if (S.phase !== 'input') return;
  if (e.key === 'Enter') { e.preventDefault(); launch(); return; }
  if (document.activeElement === inp) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault(); const d = e.key === 'ArrowRight' ? 1 : -1;
    setValue(S.value + d * cfg.step * (e.shiftKey ? 1 : 10));
  }
});
function setEnabled(on) {
  slider.classList.toggle('disabled', !on); inp.disabled = !on;
  ['minus', 'plus', 'goBtn'].forEach(id => $(id).disabled = !on);
  $('hintBtn').disabled = !on || S.hint;
}

/* ---------- flow ---------- */
function total() { return S.scores.flat().reduce((a, b) => a + b, 0); }
function hud() {
  $('hudRound').innerHTML = `Round <b>${S.round + 1}/3</b> · Try <b>${Math.min(S.attempt + 1, ATTEMPTS)}/${ATTEMPTS}</b>`;
  $('hudScore').textContent = total();
}
function modal(html, buttons) {
  const m = $('modal'); m.innerHTML = html;
  buttons.forEach(b => {
    const el = document.createElement('button'); el.className = 'btn ' + (b.cls || ''); el.textContent = b.label;
    el.onclick = () => { $('overlay').classList.remove('show'); b.fn && b.fn(); };
    m.appendChild(el);
  });
  $('overlay').classList.add('show');
}
function intro() {
  S.p = null; S.phase = 'idle'; setEnabled(false); hud();
  modal(`<h2>💥 Impact Challenge</h2>
    <p>Use <b>impulse &amp; momentum</b> and the <b>coefficient of restitution</b> to make perfect shots. Every try has new numbers, so grab a pen, calculate, and then take the shot.</p>
    <ol><li><b>Drop &amp; Bounce</b>: predict the rebound height</li>
    <li><b>Bank Shot</b>: oblique impact off a cushion</li>
    <li><b>Spring Shot</b>: impact, then energy, worked backwards</li></ol>
    <p class="muted">3 tries per round · up to 100 points each · a hint costs ${HINT_COST} points.</p>
    <input class="name" id="nameIn" placeholder="Your name or team (optional)" value="${S.name.replace(/"/g, '&quot;')}">`,
    [{ label: 'Start', cls: 'primary', fn: () => { S.name = ($('nameIn') || {}).value || S.name; roundIntro(); } }]);
  const ni = $('nameIn'); ni.addEventListener('input', () => S.name = ni.value);
}
function roundIntro() {
  const R = ROUNDS[S.round]; S.attempt = 0; S.p = null; S.anim = null; S.phase = 'idle'; hud();
  modal(`<div class="kicker">Round ${S.round + 1} of 3 · ${R.tag}</div><h2>${R.title}</h2><p>${R.intro}</p>`,
    [{ label: 'Let\'s go', cls: 'primary', fn: newAttempt }]);
}
function newAttempt() {
  const R = ROUNDS[S.round];
  S.p = R.gen(S.attempt); S.anim = null; S.hint = false; S.phase = 'input';
  const sc = R.slider(S.p); cfg = sc; $('ctlLabel').textContent = sc.label; $('unit').textContent = sc.unit;
  setValue(sc.init);
  $('givenTitle').textContent = `Given · ${R.title} ${S.attempt + 1}/${ATTEMPTS}`;
  $('given').innerHTML = R.given(S.p).map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join('');
  $('question').innerHTML = R.question(S.p);
  $('hintArea').innerHTML = '';
  $('goBtn').textContent = R.go;
  setEnabled(true); hud();
}
$('hintBtn').onclick = () => {
  if (S.phase !== 'input' || S.hint) return;
  S.hint = true; $('hintBtn').disabled = true;
  $('hintArea').innerHTML = `<div class="hintBox">💡 ${ROUNDS[S.round].hint}</div>`;
};
function launch() {
  if (S.phase !== 'input') return;
  const R = ROUNDS[S.round]; S.phase = 'anim'; setEnabled(false);
  R.start(S.p, S.value);
  if (R === bank) S.anim.inPocket = Math.abs(bank.landX(S.p, S.value) - S.p.P) <= 0.05;
}
$('goBtn').onclick = launch;
function showResult() {
  const R = ROUNDS[S.round], res = R.result(S.p, S.value);
  let pts = res.score; if (S.hint) pts = Math.max(0, pts - HINT_COST);
  S.scores[S.round].push(pts); S.phase = 'result'; hud();
  const cls = res.score >= 90 ? 'good' : res.score >= 50 ? 'ok' : 'bad';
  const title = res.score >= 95 ? 'Bullseye! 🎯' : res.score >= 75 ? 'So close!' : res.score >= 40 ? 'In the neighbourhood' : 'Missed it';
  const lastTry = S.attempt === ATTEMPTS - 1, lastRound = S.round === ROUNDS.length - 1;
  let next = 'Next try', fn = () => { S.attempt++; newAttempt(); };
  if (lastTry && !lastRound) { next = 'Next round →'; fn = () => { S.round++; roundIntro(); }; }
  if (lastTry && lastRound) { next = 'See final score'; fn = finalScreen; }
  modal(`<div class="kicker">${R.title} · Try ${S.attempt + 1} of ${ATTEMPTS}</div>
    <h2 class="${cls}">${title}</h2>
    <div class="big ${cls}">+${pts}${S.hint ? ' <span class="muted" style="font-size:14px">(hint −' + HINT_COST + ')</span>' : ''}</div>
    <div class="cmp"><div><small>Your answer</small><b>${res.yours}</b></div><div><small>Correct</small><b>${res.correct}</b></div><div><small>Round total</small><b>${S.scores[S.round].reduce((a, b) => a + b, 0)}</b></div></div>
    ${res.extra ? `<p>${res.extra}</p>` : ''}
    <details ${res.score < 75 ? 'open' : ''}><summary>Show the math</summary><div class="math">${res.math}</div></details>`,
    [{ label: next, cls: 'primary', fn }]);
}
function finalScreen() {
  const t = total(), max = ROUNDS.length * ATTEMPTS * 100, pct = t / max;
  const rank = pct >= 0.9 ? 'Impact Master 🏆' : pct >= 0.7 ? 'Momentum Pro 🚀' : pct >= 0.45 ? 'Solid Collider 💪' : 'Keep Bouncing 🏀';
  const rows = ROUNDS.map((R, i) => `<tr><td>${R.title}</td><td>${S.scores[i].join(' + ')} = ${S.scores[i].reduce((a, b) => a + b, 0)}</td></tr>`).join('');
  S.phase = 'idle'; setEnabled(false);
  modal(`<div class="kicker">Final score${S.name ? ' · ' + S.name.replace(/</g, '&lt;') : ''}</div>
    <h2>${rank}</h2><div class="big good">${t} <span class="muted" style="font-size:16px">/ ${max}</span></div>
    <table class="sum">${rows}</table>
    <p class="muted" style="margin-top:12px">Screenshot this and show your TA!</p>`,
    [{ label: 'Play again (new numbers)', cls: 'primary', fn: () => { S.round = 0; S.attempt = 0; S.scores = [[], [], []]; intro(); } }]);
}
$('helpBtn').onclick = () => {
  const wasOpen = $('overlay').classList.contains('show'), saved = $('modal').innerHTML;
  if (wasOpen) return;
  modal(`<h2>How to play</h2>
    <ul><li>Read the <b>Given</b> values and solve on paper.</li>
    <li>Enter your answer: drag the slider, tap <b>− / +</b>, or type the number. On a laptop use ← → (Shift for fine steps).</li>
    <li>Press <b>${S.p ? ROUNDS[S.round].go : 'Launch'}</b> to see what happens. You score up to 100 points for how close you are.</li>
    <li>A hint costs ${HINT_COST} points. After each try, open <b>Show the math</b> to check your work.</li></ul>
    <p class="muted">Assumptions: g = 9.81 m/s², smooth surfaces, ball size neglected.</p>`,
    [{ label: 'Got it', cls: 'primary' }]);
};

resize(); requestAnimationFrame(loop); intro();
})();
</script>
</body>
</html>
